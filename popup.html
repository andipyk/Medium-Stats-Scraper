<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medium Stats Scraper</title>
  <style>
    body {
      width: 400px;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    button {
      background-color: #1a8917;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      flex-grow: 1;
      font-weight: 500;
    }
    
    button:hover {
      background-color: #0f6c0f;
    }
    
    button#previewButton {
      background-color: #3a6b95;
    }
    
    button#previewButton:hover {
      background-color: #2a5a85;
    }
    
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    
    #status.loading {
      background-color: #f0f0f0;
      color: #333;
      display: block;
    }
    
    #status.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
    
    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    #previewContainer {
      display: none;
      margin-top: 20px;
      border: 1px solid #eee;
      border-radius: 4px;
      overflow: hidden;
    }
    
    #previewTable {
      width: 100%;
      border-collapse: collapse;
    }
    
    #previewTable th {
      text-align: left;
      padding: 8px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #eee;
    }
    
    #previewTable th.numeric {
      text-align: right;
    }
    
    #previewTable td {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    
    #previewTable tr:last-child td {
      border-bottom: none;
    }
    
    .debug-toggle {
      margin-top: 20px;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #f5f5f5;
    }
    
    .debug-toggle:hover {
      background-color: #eee;
    }
    
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Medium Stats Scraper</h1>
  
  <div class="actions">
    <button id="previewButton">Preview Data</button>
    <button id="scrapeButton">Export to CSV</button>
  </div>
  
  <div id="status">Ready</div>
  
  <div id="previewContainer">
    <table id="previewTable">
      <thead>
        <tr>
          <th>Title</th>
          <th class="numeric">Views</th>
          <th class="numeric">Reads</th>
          <th class="numeric">Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Preview data will be inserted here -->
      </tbody>
    </table>
  </div>
  
  <div class="note">
    This extension works on the Medium Stats page. Make sure you're on 
    <a href="https://medium.com/me/stats" target="_blank">medium.com/me/stats</a> before using.
  </div>
  
  <div class="debug-toggle" id="debug-toggle">
    Debug Mode: Off
  </div>
  
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
